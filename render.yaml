services:
  - type: web
    name: imotora-medusa-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: imotora-store
    buildCommand: npm install --include=dev && npm run build && cd .medusa/server && npm install --omit=dev
    startCommand: cd .medusa/server && npx medusa db:migrate && npx medusa start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        value: https://imotora.gnanaprakash22594.workers.dev,http://localhost:3000
      - key: ADMIN_CORS
        value: https://imotora-medusa-backend.onrender.com,http://localhost:9000
      - key: AUTH_CORS
        value: https://imotora.gnanaprakash22594.workers.dev,https://imotora-medusa-backend.onrender.com,http://localhost:3000,http://localhost:9000
      - key: MEDUSA_BACKEND_URL
        value: https://imotora-medusa-backend.onrender.com
      - key: STOREFRONT_URL
        value: https://imotora.gnanaprakash22594.workers.dev

